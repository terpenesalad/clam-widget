name: Update CLAM wishlists

on:
  schedule:
    - cron: "17 * * * *"  # every hour; Steam publishes yesterday's numbers once a day
  workflow_dispatch:
    inputs:
      full_refresh:
        description: "Re-fetch every day from Steam"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch wishlist numbers from Steam
        env:
          STEAM_FINANCIAL_KEY: ${{ secrets.STEAM_FINANCIAL_KEY }}
          STEAM_APP_ID: ${{ secrets.STEAM_APP_ID }}
          FULL_REFRESH: ${{ inputs.full_refresh }}
        run: python update_wishlists.py

      - name: Save results
        run: |
          git config user.name "wishlist-bot"
          git config user.email "wishlist-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Update wishlists" && git push)
