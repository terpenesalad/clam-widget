name: Update CLAM wishlists

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch wishlist numbers from Steam
        env:
          STEAM_FINANCIAL_KEY: ${{ secrets.STEAM_FINANCIAL_KEY }}
          STEAM_APP_ID: ${{ secrets.STEAM_APP_ID }}
        run: python update_wishlists.py

      - name: Save results
        run: |
          git config user.name "wishlist-bot"
          git config user.email "wishlist-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Update wishlists" && git push)
